<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Alandar — Panel de contenido</title>
    <link href="config.yml" type="text/yaml" rel="cms-config-url" />
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- Decap CMS (open source, Apache-2.0) autoalojado vía CDN con
         integridad de subrecurso (SRI): el navegador rechaza el script si
         su contenido no coincide con este hash, así que aunque el CDN sea
         comprometido, el código alterado nunca se ejecuta. Versión fija:
         cambiar de versión = generar un hash nuevo, nunca usar @latest. -->
    <script
      src="https://unpkg.com/decap-cms@3.15.1/dist/decap-cms.js"
      integrity="sha384-in6eHztHveqQ7uMZ1fDaKlDmacQLFuLH2wWrFTiymyuS8zQ5bixwL8U3AeRi8h/L"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
