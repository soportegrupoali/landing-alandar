project:
  eyebrow: Alandar | Proyecto
  title: Un desarrollo planeado para vivir hacia afuera.
  body: >-
    En Alandar, la privacidad de una comunidad residencial se fusiona con
    una ubicación privilegiada al norte de Mérida y una planeación que
    extiende tu estilo de vida más allá de tu hogar. Parques, andadores,
    casa club y espacios de convivencia crean un entorno donde cada día
    invita a caminar, compartir, convivir con tu familia y disfrutar la
    naturaleza.
  closing: La mejor calidad de vida se vive en un entorno que te invita a disfrutar cada día.
  stats:
    - label: Lotes residenciales
      value: "600"
    - label: Etapas
      value: "7"
    - label: Desde
      value: 250 m²

masterPlan:
  eyebrow: Master plan
  title: Orden, naturaleza y comunidad en un mismo recorrido.
  body: >-
    El master plan integra vialidades amplias, parques temáticos y
    amenidades distribuidas estratégicamente para que cada etapa tenga
    cercanía con áreas de convivencia y bienestar. Explora los puntos del
    mapa para conocer el proyecto.
  pins:
    - id: casa
      title: Casa Club
      desc: Área de convivencia y deportivo para fortalecer la vida en comunidad.
    - id: zona
      title: Zona Comercial
      desc: Espacio destinado a tiendas y servicios para mayor comodidad.
    - id: botanico
      title: Jardín botánico/sensorial
      desc: Espacios verdes con vegetación variada para relajación.
    - id: holistico
      title: Jardín holístico
      desc: Lugar diseñado para actividades de bienestar y meditación.
    - id: canchas
      title: Cancha de pádel y básquetbol
      desc: Instalaciones deportivas para actividades recreativas.
    - id: gym1
      title: Gimnasio al aire libre
      desc: Área con equipo para ejercicio en exterior.
    - id: active
      title: Active Park
      desc: Equipamiento de gimnasio exterior, áreas verdes y mobiliario urbano.
    - id: multi
      title: Multifuncional/Yoga
      desc: Espacios abiertos para actividades deportivas y relajación.
    - id: infantil
      title: Juegos infantiles
      desc: Áreas diseñadas para la diversión de los niños.
    - id: pet
      title: Pet Park
      desc: Espacio recreativo para mascotas.
    - id: picnic
      title: Picnic/reunión/terrazas
      desc: Zonas de convivencia al aire libre.

